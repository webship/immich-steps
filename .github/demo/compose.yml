# The demo the features run against: Immich v3.4.2 as it ships, machine learning off (no machine-learning container,
# IMMICH_MACHINE_LEARNING_ENABLED=false): its server, its Postgres with the vector extensions, and valkey, each pinned by
# digest. The library (the photos) is IMMICH_LIBRARY, a folder of demo-app/. Built and started by
# .github/scripts/build-demo.sh, at http://127.0.0.1:8502; removed by .github/scripts/remove-demo.sh.
name: immich-steps-demo
services:
  server:
    # ghcr.io/immich-app/immich-server:v3.4.2
    image: ghcr.io/immich-app/immich-server@sha256:fc880c1bf665b4aab1e74c15e56ab871225989cd546536e6b77e771869af06bd
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
      IMMICH_MACHINE_LEARNING_ENABLED: 'false'
      TZ: Etc/UTC
    volumes:
      - ${IMMICH_LIBRARY}:/data
    ports:
      - '127.0.0.1:8502:2283'
    depends_on:
      redis:
        condition: service_started
      database:
        condition: service_healthy
  redis:
    # docker.io/valkey/valkey:9
    image: docker.io/valkey/valkey@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
  database:
    # ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    image: ghcr.io/immich-app/postgres@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - db-data:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d immich']
      interval: 3s
      retries: 60
volumes:
  db-data:
